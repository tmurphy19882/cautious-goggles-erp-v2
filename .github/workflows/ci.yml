name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Path filter — this repo only ships services/erp/** + docs/** + infra/** + scripts/**
# If you change anything else, this workflow will skip; add new paths when needed.

env:
  PYTHON_VERSION: "3.12"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check services/erp

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install mypy
        run: pip install mypy
      - name: Type-check
        run: |
          # Mypy only runs once a wave has actual typed code (W0+).
          if find services/erp/src -name "*.py" -not -name "app.py" | grep -q .; then
            mypy services/erp/src
          else
            echo "no typed code yet (pre-W0); skipping"
          fi

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        working-directory: services/erp
        run: |
          pip install -e ".[dev]"
      - name: Test
        working-directory: services/erp
        run: |
          if find tests -name "test_*.py" | grep -q .; then
            pytest
          else
            echo "no tests yet (pre-W0); skipping"
          fi

  audit-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every audit-punch-list row maps to a wave in SPEC.md
        run: |
          # Light sanity: every row in AUDIT.md section 4 has a SPEC.md section anchor
          python - <<'PY'
          import re, pathlib
          audit = pathlib.Path("AUDIT.md").read_text(encoding="utf-8")
          spec = pathlib.Path("docs/SPEC.md").read_text(encoding="utf-8")
          wave_headers = re.findall(r"^## (\d+\. .+)$", spec, re.MULTILINE)
          assert wave_headers, "no wave headers found in docs/SPEC.md"
          print(f"OK — {len(wave_headers)} waves in SPEC.md")
          PY
