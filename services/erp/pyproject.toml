[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-v2"
version = "0.1.0"
description = "ERP service v2 — rebuild of cautious-goggles/services/erp per docs/SPEC.md"
readme = "../../../README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Trevor Murphy" }]

dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Validation
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Observability
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    # Auth
    "pyjwt>=2.9",
    # Async messaging
    "aiokafka>=0.12",
    # HTTP client
    "httpx>=0.27",
    # Money
    "babel>=2.16",
    "py-moneyed>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-dateutil",
    "testcontainers[postgres]>=4.8",
    "faker>=30.0",
]

[project.scripts]
erp-v2-dump-openapi = "scripts.dump_openapi:main"
erp-v2-check-coverage = "scripts.check_coverage:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"identity" = ["py.typed"]
"shared" = ["py.typed"]
"observability" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF", "PT"]
ignore = [
    "S101",  # asserts allowed in tests
    "E501",  # line length handled by formatter
    "B008",  # FastAPI Depends/Query defaults are intentional dependency markers
    "B017",
    "B904",
    "B905",
    "E741",
    "F401",  # legacy modules intentionally re-export/import for side effects
    "F541",
    "F811",
    "F841",
    "I001",  # defer formatting-only import churn
    "N806",
    "N818",
    "PT011",
    "RUF005",
    "RUF012",
    "RUF022",
    "RUF023",
    "RUF100",
    "S110",
    "S607",
    "S608",  # migrations build SQL from fixed table names
    "ASYNC221",
    "ASYNC240",
    "UP012",
    "UP017",
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]  # test ergonomics
"scripts/**/*.py" = ["S"]  # scripts can be loose

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false  # FastAPI decorators

[[tool.mypy.overrides]]
module = ["alembic.*", "testcontainers.*", "freezegun.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=src --cov-report=term-missing"
markers = [
    "contract: pact-style contract tests against other services",
    "integration: requires running infra (Postgres, Kafka)",
    "unit: pure unit tests, no infra",
    "slow: takes >1s, run with --runslow",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:botocore.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
